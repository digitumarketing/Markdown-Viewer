<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Digitum Markdown Viewer</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="48x48" href="/icons/icon-48.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#EFEAE1;--ink:#272320;--muted:#6B645C;--rule:#D6CFC2;--lime:#C8FF00}
@media (prefers-color-scheme:dark){:root{--paper:#272320;--ink:#EFEAE1;--muted:#A69E93;--rule:#443D37}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--paper);color:var(--ink);font-family:'Outfit',system-ui,sans-serif}
main{max-width:520px}
.code{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-size:34px;font-weight:700;margin:10px 0 10px;line-height:1.15}
p{color:var(--muted);font-size:16px;line-height:1.6;margin:0 0 24px}
nav{display:flex;flex-wrap:wrap;gap:10px}
a{display:inline-block;padding:10px 16px;border-radius:8px;border:1px solid var(--rule);color:var(--ink);text-decoration:none;font-weight:600;font-size:15px}
a.main{background:var(--lime);color:#272320;border-color:transparent}
a:hover{border-color:var(--ink)}
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>This page does not exist</h1>
  <p>The link may be mistyped, or the page has moved. The markdown viewer and its tools are all still here.</p>
  <nav>
    <a class="main" href="/">Open the markdown viewer</a>
    <a href="/markdown-editor">Markdown editor</a>
    <a href="/markdown-to-pdf">Markdown to PDF</a>
    <a href="/markdown-cheat-sheet">Cheat sheet</a>
  </nav>
</main>
</body>
</html>
